name: Deploy Laravel to Lolipop (Reserve + Demo)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install Composer
        run: composer install --no-dev --optimize-autoloader

      - name: Deploy to reserve
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.lolipop.jp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: reserve/laravel/
          exclude: |
            **/.env
            **/storage/**
            **/.git*
            **/.github/**
            **/node_modules/**

      - name: Deploy to demo
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.lolipop.jp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: demo/laravel/
          exclude: |
            **/.env
            **/storage/**
            **/.git*
            **/.github/**
            **/node_modules/**
